name: t041r-browser-http-composition

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/t041r-browser-http-composition.yml"

permissions:
  contents: write

jobs:
  qualify-browser-http-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply typed HTTP composition
        run: python3 scripts/patch_t041r_browser_http_composition.py
      - name: Format
        run: cargo fmt --all
      - name: Architecture boundaries
        run: python3 scripts/check_architecture.py
      - name: Verify browser, transport and app composition
        run: |
          cargo check -p webgate-browser -p webgate-transport -p webgate-app --all-targets --locked
          cargo test -p webgate-browser --locked
          cargo test -p webgate-transport --locked
          cargo test -p webgate-app --locked
          cargo clippy -p webgate-browser -p webgate-transport -p webgate-app --all-targets --locked -- -D warnings
      - name: Commit qualified composition and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/t041r-browser-http-composition.yml scripts/patch_t041r_browser_http_composition.py
          git add crates/webgate-browser/src/lib.rs crates/webgate-browser/src/adapter.rs crates/webgate-browser/src/capsule.rs crates/webgate-app/src/main.rs crates/webgate-app/src/session.rs
          git commit -m "feat(browser): enforce typed HTTP renderer proxy composition"
          git push origin HEAD:main
