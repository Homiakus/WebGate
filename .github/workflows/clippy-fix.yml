name: clippy-fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clippy-fix.yml"

permissions:
  contents: write

jobs:
  fix-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: true
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply equivalent array-chunk conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/webgate-core/src/ed25519.rs')
          s = p.read_text()
          pairs = [
              ('for (i, chunk) in block.chunks_exact(8).enumerate() {', 'for (i, chunk) in block.as_chunks::<8>().0.iter().enumerate() {'),
              ('w[i] = u64::from_be_bytes(chunk.try_into().unwrap_or([0u8; 8]));', 'w[i] = u64::from_be_bytes(*chunk);'),
              ('for (i, chunk) in input.chunks_exact(8).enumerate() {', 'for (i, chunk) in input.as_chunks::<8>().0.iter().enumerate() {'),
              ('num[i] = u64::from_le_bytes(chunk.try_into().unwrap_or([0u8; 8]));', 'num[i] = u64::from_le_bytes(*chunk);'),
          ]
          for old, new in pairs:
              assert s.count(old) == 1, (old, s.count(old))
              s = s.replace(old, new)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Verify crypto vectors and workspace policy
        run: |
          cargo test -p webgate-core --locked
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Remove temporary diagnostic workflows and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clippy-fix.yml .github/workflows/clippy-diagnostic.yml
          git add crates/webgate-core/src/ed25519.rs
          git commit -m "fix(core): keep crypto code green on stable clippy"
          git push origin HEAD:main
