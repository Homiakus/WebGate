name: clippy-fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clippy-fix.yml"

permissions:
  contents: read

jobs:
  diagnose-post-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply candidate equivalent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/webgate-core/src/ed25519.rs')
          s = p.read_text()
          pairs = [
              ('for (i, chunk) in block.chunks_exact(8).enumerate() {', 'for (i, chunk) in block.as_chunks::<8>().0.iter().enumerate() {'),
              ('for (i, chunk) in input.chunks_exact(8).enumerate() {', 'for (i, chunk) in input.as_chunks::<8>().0.iter().enumerate() {'),
          ]
          for old, new in pairs:
              assert s.count(old) == 1, (old, s.count(old))
              s = s.replace(old, new)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Capture verification
        shell: bash
        run: |
          set +e
          {
            echo '=== cargo test -p webgate-core ==='
            cargo test -p webgate-core --locked
            echo "CORE_TEST_EXIT=$?"
            echo '=== cargo clippy workspace ==='
            cargo clippy --workspace --all-targets --locked -- -D warnings
            echo "CLIPPY_EXIT=$?"
          } > post-fix.log 2>&1
          cat post-fix.log
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: post-fix-clippy-diagnostic
          path: post-fix.log
          if-no-files-found: error
