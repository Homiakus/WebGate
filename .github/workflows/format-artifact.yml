name: format-artifact

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/format-artifact.yml"

permissions:
  contents: read

jobs:
  rustfmt-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Install Rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format workspace
        run: cargo fmt --all

      - name: Upload formatted client source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustfmt-client-main
          path: crates/webgate-app/src/main.rs
          if-no-files-found: error
