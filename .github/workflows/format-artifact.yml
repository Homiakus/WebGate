name: format-artifact

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/format-artifact.yml"

permissions:
  contents: write

jobs:
  rustfmt-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: true

      - name: Install Rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format workspace
        run: cargo fmt --all

      - name: Commit formatted client source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/webgate-app/src/main.rs
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style(client): rustfmt truthful UI changes"
          git push origin HEAD:main
