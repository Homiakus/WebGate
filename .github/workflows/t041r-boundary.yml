name: t041r-boundary

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/t041r-boundary.yml"

permissions:
  contents: write

jobs:
  qualify-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: true
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply renderer evidence boundary
        run: python3 scripts/patch_t041r_boundary.py
      - name: Format
        run: cargo fmt --all
      - name: Verify browser and app contracts
        run: |
          cargo check -p webgate-browser -p webgate-app --all-targets --locked
          cargo test -p webgate-browser --locked
          cargo test -p webgate-app --locked
          cargo clippy -p webgate-browser -p webgate-app --all-targets --locked -- -D warnings
      - name: Commit qualified boundary and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/t041r-boundary.yml scripts/patch_t041r_boundary.py
          git add crates/webgate-browser/src/adapter.rs crates/webgate-browser/src/capsule.rs crates/webgate-app/src/session.rs
          git commit -m "refactor(browser): separate contract adapter from renderer proof"
          git push origin HEAD:main
