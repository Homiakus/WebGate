name: rust-ci

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Project manager tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Project manager command contract
        run: python3 scripts/project_manager.py verify --dry-run

      - name: Architecture boundaries
        run: python3 scripts/check_architecture.py

      - name: Verify lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  go-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod

      - name: Go format
        working-directory: server
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Go files require gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Go vet
        working-directory: server
        run: go vet ./...

      - name: Go test
        working-directory: server
        run: go test ./...

  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
