name: rust-ci

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-stable-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Apply equivalent crypto source conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/webgate-core/src/ed25519.rs')
          s = p.read_text()
          pairs = [
              ('for (i, chunk) in block.chunks_exact(8).enumerate() {', 'for (i, chunk) in block.as_chunks::<8>().0.iter().enumerate() {'),
              ('w[i] = u64::from_be_bytes(chunk.try_into().unwrap_or([0u8; 8]));', 'w[i] = u64::from_be_bytes(*chunk);'),
              ('for (i, chunk) in input.chunks_exact(8).enumerate() {', 'for (i, chunk) in input.as_chunks::<8>().0.iter().enumerate() {'),
              ('num[i] = u64::from_le_bytes(chunk.try_into().unwrap_or([0u8; 8]));', 'num[i] = u64::from_le_bytes(*chunk);'),
          ]
          for old, new in pairs:
              assert s.count(old) == 1, (old, s.count(old))
              s = s.replace(old, new)
          p.write_text(s)
          PY
          cargo fmt --all

      - name: Verify crypto vectors, build and clippy
        run: |
          cargo test -p webgate-core --locked
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Restore normal CI and commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/rust-ci.yml > .github/workflows/rust-ci.yml
          git rm -f .github/workflows/clippy-fix.yml .github/workflows/clippy-diagnostic.yml
          git add crates/webgate-core/src/ed25519.rs .github/workflows/rust-ci.yml
          git commit -m "fix(core): keep crypto code green on stable clippy"
          git push origin HEAD:main
