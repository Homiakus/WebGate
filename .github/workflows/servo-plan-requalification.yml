name: servo-plan-requalification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/servo-plan-requalification.yml"

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: true
      - name: Apply plan patch
        run: python3 scripts/patch_plan_servo_requalification.py
      - name: Commit plan and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/servo-plan-requalification.yml scripts/patch_plan_servo_requalification.py
          git add MASTER_PLAN.md
          git commit -m "docs(plan): reopen real Servo renderer qualification"
          git push origin HEAD:main
