name: t041r-http-bridge-status

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/t041r-http-bridge-status.yml"

permissions:
  contents: write

jobs:
  qualify-http-bridge-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply live status patch
        run: python3 scripts/patch_t041r_http_bridge_status.py
      - name: Format
        run: cargo fmt --all
      - name: Verify transport live status
        run: |
          cargo check -p webgate-transport --all-targets --locked
          cargo test -p webgate-transport --locked
          cargo clippy -p webgate-transport --all-targets --locked -- -D warnings
      - name: Commit qualified status handle and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/t041r-http-bridge-status.yml scripts/patch_t041r_http_bridge_status.py
          git add crates/webgate-transport/src/restricted_http_connect.rs
          git commit -m "feat(transport): expose live HTTP bridge status"
          git push origin HEAD:main
# rerun: status regression uses a probe-only SOCKS5 sidecar
