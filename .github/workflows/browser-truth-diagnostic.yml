name: browser-truth-diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/browser-truth-diagnostic.yml"

permissions:
  contents: read

jobs:
  capture-repaired:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - name: Apply deterministic probe timing candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test_client_ui_browser.py')
          s = p.read_text()
          pairs = [
              ("  window.addEventListener('load', async () => {{", "  setTimeout(async () => {{"),
              ("  }});\n}})();\n</script>", "  }}, 500);\n}})();\n</script>"),
              ('            fail_fragment = "WEBGATE_BROWSER_TRUTH_FAIL:"', '            fail_fragment = f"WEBGATE_BROWSER_TRUTH_FAIL:{scenario}:"'),
              ('"--virtual-time-budget=2500",', '"--virtual-time-budget=4000",'),
          ]
          for old, new in pairs:
              if old in s:
                  s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Capture repaired browser qualification
        shell: bash
        run: |
          set +e
          python3 scripts/test_client_ui_browser.py > repaired-browser-truth.log 2>&1
          code=$?
          echo "EXIT=$code" >> repaired-browser-truth.log
          cat repaired-browser-truth.log
          exit 0
      - name: Upload repaired diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repaired-browser-truth-diagnostic
          path: repaired-browser-truth.log
          if-no-files-found: error
