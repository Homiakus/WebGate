name: browser-truth-diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/browser-truth-diagnostic.yml"

permissions:
  contents: write

jobs:
  repair-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: true
      - name: Repair browser qualification harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test_client_ui_browser.py')
          s = p.read_text()
          pairs = [
              ('    return f"""\n<script>\n(() => {{{{', '    return f"""\n(() => {{{{'),
              ('  window.addEventListener(\'load\', async () => {{{{', '  setTimeout(async () => {{{{'),
              ('  }}}});\n}}}})();\n</script>\n"""', '  }}}}, 500);\n}}}})();\n"""'),
              ('            fail_fragment = "WEBGATE_BROWSER_TRUTH_FAIL:"', '            fail_fragment = f"WEBGATE_BROWSER_TRUTH_FAIL:{scenario}:"'),
              ('"--virtual-time-budget=2500",', '"--virtual-time-budget=4000",'),
          ]
          for old, new in pairs:
              if old in s:
                  s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Run all real browser truth scenarios
        run: python3 scripts/test_client_ui_browser.py
      - name: Commit qualified harness and remove diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/browser-truth-diagnostic.yml
          git add scripts/test_client_ui_browser.py
          git commit -m "test(client): qualify truthful UI in real Chromium"
          git push origin HEAD:main
