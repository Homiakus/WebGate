name: apply-transport-resilience-plan

on:
  push:
    branches:
      - work/transport-resilience-plan-20260903
    paths:
      - .github/workflows/apply-transport-resilience-plan.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/transport-resilience-plan-20260903
          fetch-depth: 0
      - name: Append section 18 to MASTER_PLAN
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          marker = '# 18. Transport Resilience v3 — Carrier-Independent Session Continuity'
          master = Path('MASTER_PLAN.md')
          appendix = Path('docs/implementation/_transport_resilience_v3_appendix.tmp.md')
          text = master.read_text(encoding='utf-8')
          if marker not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '\n---\n\n' + appendix.read_text(encoding='utf-8')
              master.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary generator files
        run: |
          git rm .github/workflows/apply-transport-resilience-plan.yml
          git rm docs/implementation/_transport_resilience_v3_appendix.tmp.md
      - name: Commit generated plan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MASTER_PLAN.md
          git commit -m "docs(plan): add carrier-independent transport resilience program"
          git push origin HEAD:work/transport-resilience-plan-20260903
