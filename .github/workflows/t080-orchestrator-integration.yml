name: t080-orchestrator-integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/t080-orchestrator-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: true
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply deterministic integration patch
        run: python3 scripts/patch_t080_orchestrator.py
      - name: Format
        run: cargo fmt --all
      - name: Verify app orchestration
        run: |
          cargo check -p webgate-app --all-targets --locked
          cargo test -p webgate-app --locked
          cargo clippy -p webgate-app --all-targets --locked -- -D warnings
      - name: Commit qualified integration and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/t080-orchestrator-integration.yml scripts/patch_t080_orchestrator.py
          git add crates/webgate-app/src/main.rs crates/webgate-app/src/session.rs
          git commit -m "feat(client): route GUI and CLI through session orchestrator"
          git push origin HEAD:main
