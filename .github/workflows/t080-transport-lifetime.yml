name: t080-transport-lifetime

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/t080-transport-lifetime.yml"

permissions:
  contents: write

jobs:
  qualify-lifetime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: true
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply transport lifetime patch
        run: |
          python3 scripts/patch_t080_transport_lifetime.py
          python3 scripts/fix_t080_transport_lifetime.py
      - name: Format
        run: cargo fmt --all
      - name: Verify client lifetime contract
        run: |
          cargo check -p webgate-app --all-targets --locked
          cargo test -p webgate-app --locked
          cargo clippy -p webgate-app --all-targets --locked -- -D warnings
      - name: Commit qualified lifetime fix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/t080-transport-lifetime.yml scripts/patch_t080_transport_lifetime.py scripts/fix_t080_transport_lifetime.py
          git add crates/webgate-app/src/main.rs
          git commit -m "fix(client): retain live transport owner and status"
          git push origin HEAD:main
# rerun: direct unit callers adapted and start-error causes are consumed by Display
