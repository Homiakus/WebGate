name: t041r-servo05-probe

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/t041r-servo06-probe.yml"

permissions:
  contents: write

jobs:
  qualify-servo05:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply Servo feature probe
        run: python3 scripts/patch_t041r_servo06_probe.py
      - name: Resolve and compile exact Servo 0.5 feature
        run: cargo check -p webgate-browser --features servo-runtime
      - name: Format
        run: cargo fmt --all -- --check
      - name: Architecture boundaries
        run: python3 scripts/check_architecture.py
      - name: Default browser qualification
        run: |
          cargo check -p webgate-browser --all-targets --locked
          cargo test -p webgate-browser --locked
          cargo clippy -p webgate-browser --all-targets --locked -- -D warnings
      - name: Servo 0.5 feature qualification
        run: |
          cargo check -p webgate-browser --all-targets --features servo-runtime --locked
          cargo test -p webgate-browser --features servo-runtime --locked
          cargo clippy -p webgate-browser --all-targets --features servo-runtime --locked -- -D warnings
      - name: Dependency policy with Servo enabled
        run: cargo deny check --all-features
      - name: Commit qualified feature boundary and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/t041r-servo06-probe.yml scripts/patch_t041r_servo06_probe.py
          git add crates/webgate-browser/Cargo.toml crates/webgate-browser/src/lib.rs crates/webgate-browser/src/servo_runtime.rs Cargo.lock
          git commit -m "feat(browser): pin Servo 0.5 behind runtime feature"
          git push origin HEAD:main
